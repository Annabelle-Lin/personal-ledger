<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>S9 测试面板 - 个人记账本系统</title>
  <style>
    body { font-family: -apple-system, "Microsoft YaHei", sans-serif; margin: 24px; background: #f7f8fa; color: #222; }
    h1 { font-size: 20px; }
    .tip { background: #fff7e6; border: 1px solid #ffd591; padding: 12px 16px; border-radius: 8px; margin: 12px 0; line-height: 1.6; }
    #results { margin-top: 16px; }
    .row { display: flex; gap: 12px; align-items: baseline; padding: 10px 14px; margin: 6px 0; border-radius: 6px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .row.ok { border-left: 4px solid #52c41a; }
    .row.bad { border-left: 4px solid #ff4d4f; }
    .tag { font-weight: 700; white-space: nowrap; }
    .name { font-weight: 600; min-width: 280px; }
    .msg { color: #666; }
  </style>
</head>
<body>
  <h1>🧪 S9 测试面板（测试负责人专用）</h1>
  <div class="tip">
    <b>怎么用（零基础也能跑）：</b><br/>
    1. 把这个文件放到你们项目的 <code>tests/</code> 文件夹里（和下面的脚本路径匹配）。<br/>
    2. 确认 <code>../js/</code> 里有 storage.js / finance.js / form.js / filter.js（名字按你们实际改）。<br/>
    3. 用浏览器（Chrome/Edge）直接打开本文件，页面会自动跑测试并显示结果。<br/>
    4. 绿色=通过，红色=失败。失败的把信息抄到《测试清单与Bug记录》里交给对应同学。<br/>
    5. 每次别人合并代码后，再打开一次，对比通过数量——这就是“回归测试”。
  </div>

  <!-- 先把项目里其他同学的模块加载进来，tests.js 才能测它们 -->
  <script src="../js/storage.js"></script>
  <script src="../js/finance.js"></script>
  <script src="../js/form.js"></script>
  <script src="../js/filter.js"></script>

  <!-- 最后加载测试脚本 -->
  <script src="tests.js"></script>

  <div id="results"><p>正在运行测试……</p></div>
</body>
</html>
